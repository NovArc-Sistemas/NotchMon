<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Codenotch Usage</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;background:transparent;overflow:hidden;user-select:none}
  body{font-family:"Segoe UI",system-ui,sans-serif;color:#e8e8ea;font-size:12px}
  /* The window is exactly as tall as this panel (the page reports its height), so nothing ever scrolls */
  .panel{width:100%;background:#0b0b0b;border:1px solid #2a2a2a;border-radius:16px;padding:14px 16px 8px;position:relative}
  .hd{display:flex;align-items:center;gap:8px}.hd b{font-size:15px;color:#fff;margin-right:auto}
  .hd svg{width:20px;height:19px;display:block}
  .muted{color:#8a8a8a;font-size:10.5px}
  .x{color:#8a8a8a;font-size:18px;line-height:1;cursor:pointer;padding:0 2px}.x:hover{color:#fff}
  .seg{display:flex;gap:3px;background:#151515;border-radius:8px;padding:2px;margin-top:8px}
  .seg span{flex:1;text-align:center;padding:4px 0;border-radius:6px;color:#9a9a9a;font-size:11px;cursor:pointer}
  .seg span.on{background:#2a2a2a;color:#fff;font-weight:600}
  .kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}
  .kpi{background:#151515;border-radius:8px;padding:6px 8px}.kpi b{display:block;font-size:15px;color:#fff;font-variant-numeric:tabular-nums}.kpi span{color:#8a8a8a;font-size:10px}
  .split{display:flex;height:6px;border-radius:3px;overflow:hidden;margin:10px 0 4px;background:#1c1c1c}
  .legend2{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:10.5px;color:#bdbdbd}.legend2 i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:4px}
  .blk{margin-top:14px}
  .blk-h{display:flex;justify-content:space-between;align-items:baseline;font-weight:700;color:#fff}
  .blk-h em{font-style:normal;font-weight:400;color:#8a8a8a;font-size:10.5px}
  .metric{display:flex;gap:6px;margin:6px 0 8px}.metric span{padding:2px 8px;border-radius:10px;background:#151515;color:#9a9a9a;font-size:10.5px;cursor:pointer}.metric span.on{background:#3a220e;color:#ffb070}
  .months{display:grid;grid-template-columns:repeat(26,1fr);gap:3px;font-size:9px;color:#6a6a6a;margin-bottom:3px;height:11px}
  .months span{white-space:nowrap}
  .heat{display:grid;grid-template-columns:repeat(26,1fr);grid-template-rows:repeat(7,auto);gap:3px}
  .heat i{aspect-ratio:1;border-radius:2px;background:#1c1c1c;display:block}
  .heat i.fut{background:transparent}
  .heat i.today{outline:1.5px solid #fff;outline-offset:-1px}
  .heat i:not(.fut):hover{outline:1.5px solid #ffb070;outline-offset:-1px}
  .hl{display:flex;justify-content:space-between;align-items:center;margin-top:6px;font-size:10px;color:#6a6a6a}
  .scale{display:flex;gap:3px;align-items:center}.scale i{width:10px;height:10px;border-radius:2px;display:block}
  details{border-top:1px solid #1c1c1c}
  details:first-of-type{margin-top:12px}
  summary{list-style:none;display:flex;align-items:center;gap:8px;padding:8px 0;cursor:pointer;color:#e8e8ea;font-weight:600}
  summary::-webkit-details-marker{display:none}
  summary .val{margin-left:auto;color:#9a9a9a;font-weight:400;font-size:11px;max-width:60%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  summary .chev{color:#6a6a6a;transition:transform .15s;width:10px}
  details[open] summary .chev{transform:rotate(90deg)}
  .body{padding:0 0 10px 18px}
  .li{display:flex;justify-content:space-between;gap:10px;margin:3px 0;color:#cfcfcf}
  .li span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .li span:last-child{color:#9a9a9a;white-space:nowrap;font-variant-numeric:tabular-nums}
  .warn{color:#FFB347 !important}
  .chart{display:flex;align-items:flex-end;gap:3px;height:44px;border-bottom:1px solid #262626}.chart i{flex:1;border-radius:2px 2px 0 0;min-height:1px;display:block}
  .axis{display:flex;justify-content:space-between;color:#6a6a6a;font-size:9.5px;margin-top:2px}
  .empty{color:#8a8a8a;padding:12px 0}
  /* The day's popup, over the panel above the grid: outside it would need a window strip that swallows clicks */
  #tip{position:absolute;z-index:9;pointer-events:none;width:260px;background:#0b0b0b;border:1px solid #3a3a3a;border-radius:12px;padding:10px 12px;box-shadow:0 8px 24px rgba(0,0,0,.6);display:none}
  #tip .t-h{font-weight:700;color:#fff;font-size:13px}
  #tip .t-sub{color:#8a8a8a;font-size:10.5px;margin-bottom:8px}
  #tip .g{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  #tip .g div{background:#151515;border-radius:8px;padding:5px 7px}#tip .g b{display:block;color:#fff;font-size:13px}#tip .g span{color:#8a8a8a;font-size:9.5px}
  #tip h5{margin:8px 0 3px;font-size:10.5px;color:#cfcfcf}
  #tip .li{font-size:11px;margin:2px 0}
</style></head><body>
<div class="panel" id="panel">
  <div class="hd">
    <svg viewBox="0 0 60 56" role="img" aria-label="NovArc"><path d="M19 6 H6 V50 H19 V44 H12 V12 H19 Z" fill="#FFFFFF"></path><path d="M31.5 6 H39.5 L28.5 50 H20.5 Z" fill="#0A6CFF"></path><path d="M41 6 H54 V50 H41 V44 H48 V12 H41 Z" fill="#FFFFFF"></path></svg>
    <b>Usage</b><span class="muted" id="age"></span><span class="x" id="close" title="Close (Esc)">×</span>
  </div>
  <div class="seg" id="prov"><span data-v="all">All</span><span data-v="claude">Claude</span><span data-v="codex">Codex</span></div>
  <div class="seg" id="per"><span data-v="today">Today</span><span data-v="week">7 days</span><span data-v="30days">30 days</span><span data-v="month">Month</span></div>
  <div id="summary"></div>
  <div class="blk">
    <div class="blk-h">Activity <em id="heat-sum"></em></div>
    <div class="metric" id="metric"><span data-m="s" class="on">Sessions</span><span data-m="tok">Tokens</span><span data-m="c">Cost</span><span data-m="k">Calls</span></div>
    <div class="months" id="months"></div>
    <div class="heat" id="heat"></div>
    <div class="hl"><span id="peak"></span><span class="scale">less<i style="background:#1c1c1c"></i><i style="background:#4a2308"></i><i style="background:#8a3c0a"></i><i style="background:#d2600f"></i><i style="background:#ff8a2a"></i>more</span></div>
  </div>
  <div id="sections"></div>
  <div id="tip"></div>
</div>
<script>
const invoke=window.__TAURI__.core.invoke, listen=window.__TAURI__.event.listen;
let cb={available:false,periods:{},days:{}}, prov='all', per='today', metric='s', openSec=null;
const RAMP=['#1c1c1c','#4a2308','#8a3c0a','#d2600f','#ff8a2a'];
const PCOL={claude:'#FF7A1A',codex:'#6ab7ff',cursor:'#b28cff',gemini:'#5ad1a4'};
const NAMES={claude:'Claude',codex:'Codex',cursor:'Cursor',gemini:'Gemini'};
const DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const esc=s=>{const d=document.createElement('div');d.textContent=s==null?'':String(s);return d.innerHTML;};
const nf=n=>(n||0).toLocaleString('en-US');
const tok=n=>n>=1e9?(n/1e9).toFixed(1)+'B':n>=1e6?Math.round(n/1e6)+'M':n>=1e3?Math.round(n/1e3)+'k':String(n||0);
const usd=n=>n==null||!isFinite(n)?'—':n>=10000?'$'+(n/1000).toFixed(1)+'k':'$'+Math.round(n).toLocaleString('en-US');
const base=p=>String(p||'').split(/[\\/]/).filter(Boolean).pop()||String(p||'');
const ago=ms=>{const m=Math.round((Date.now()-ms)/60000);return m<1?'just now':m<60?m+' min ago':Math.round(m/60)+' h ago';};
// Claude.ai connectors show up as UUIDs; a short form is all that can honestly be said about them
const mcpName=n=>/^[0-9a-f]{8}-[0-9a-f-]{27}$/i.test(n)?'connector '+n.slice(0,4):n;

function seg(id,val){ document.querySelectorAll(`#${id} span`).forEach(s=>s.classList.toggle('on',s.dataset.v===val)); }
function li(a,b,cls=''){ return `<div class="li"><span>${a}</span><span class="${cls}">${b}</span></div>`; }

function render(){
  seg('prov',prov); seg('per',per);
  const v=cb.periods[`${prov}:${per}`], cur=v&&v.current;
  document.getElementById('age').textContent=v&&v.generated?ago(Date.parse(v.generated)):'';
  const sum=document.getElementById('summary'), secs=document.getElementById('sections');
  if(!cb.available){ sum.innerHTML=`<div class="empty">codeburn is not installed (npm i -g codeburn).</div>`; secs.innerHTML=''; paintHeat(); report(); return; }
  if(!cur){ sum.innerHTML=`<div class="empty">Reading codeburn… the first pass takes a minute or two.</div>`; secs.innerHTML=''; paintHeat(); report(); return; }
  const tokens=(cur.inputTokens||0)+(cur.outputTokens||0)+(cur.cacheReadTokens||0)+(cur.cacheWriteTokens||0);
  let h=`<div class="kpis">
    <div class="kpi"><span>API cost</span><b>${usd(cur.cost)}</b></div><div class="kpi"><span>Calls</span><b>${nf(cur.calls)}</b></div><div class="kpi"><span>Sessions</span><b>${nf(cur.sessions)}</b></div>
    <div class="kpi"><span>Tokens</span><b>${tok(tokens)}</b></div><div class="kpi"><span>Cache</span><b>${cur.cacheHitPercent!=null?Math.round(cur.cacheHitPercent)+'%':'—'}</b></div><div class="kpi"><span>First try</span><b>${cur.oneShotRate!=null?Math.round(cur.oneShotRate*100)+'%':'—'}</b></div></div>`;
  if(prov==='all'&&cur.providers){
    const ent=Object.entries(cur.providers).filter(([,c])=>c>0).sort((a,b)=>b[1]-a[1]), tot=ent.reduce((a,[,c])=>a+c,0)||1;
    h+=`<div class="split">${ent.map(([k,c])=>`<div style="width:${c/tot*100}%;background:${PCOL[k]||'#888'}"></div>`).join('')}</div>
      <div class="legend2">${ent.map(([k,c])=>`<span><i style="background:${PCOL[k]||'#888'}"></i>${esc(NAMES[k]||k)} ${usd(c)}</span>`).join('')}</div>`;
  }
  sum.innerHTML=h;

  const S=[];
  if(v.daily&&v.daily.length){
    const mx=Math.max(...v.daily.map(d=>d.cost||0),1), pk=v.daily.reduce((a,d)=>(d.cost||0)>(a.cost||0)?d:a,v.daily[0]);
    const tone=f=>f<.5?`hsl(${150-f*120},100%,55%)`:`hsl(${90-(f-.5)*2*75},100%,52%)`;
    S.push(['Cost per day',`14 days · peak ${usd(pk.cost)}`,`<div class="chart">${v.daily.map((d,i)=>`<i title="${esc(d.date)}: ${usd(d.cost)}" style="height:${Math.max(2,Math.round((d.cost||0)/mx*100))}%;background:${i===v.daily.length-1?'#fff':tone((d.cost||0)/mx)}"></i>`).join('')}</div><div class="axis"><span>${esc(v.daily[0].date.slice(5))}</span><span>today</span></div>`]);
  }
  const P=cur.topProjects||[];
  if(P.length) S.push(['Projects',`${esc(base(P[0].name))} · ${usd(P[0].cost)}`,P.map(p=>li(esc(base(p.name)),`${usd(p.cost)} · ${nf(p.sessions)} sessions`)).join('')]);
  const T=cur.topSessions||[];
  if(T.length) S.push(['Top sessions',`${esc(base(T[0].project))} · ${usd(T[0].cost)}`,T.map(t=>li(`${esc(base(t.project))} <span class="muted">${esc((t.date||'').slice(5))}</span>`,`${usd(t.cost)} · ${nf(t.calls)} calls`)).join('')]);
  const M=cur.topModels||[], E={}; (cur.modelEfficiency||[]).forEach(e=>E[e.name]=e);
  if(M.length) S.push(['Models',`${esc(M[0].name)} · ${usd(M[0].cost)}`,M.map(m=>{const e=E[m.name];return li(esc(m.name),`${usd(m.cost)}${e?` · $${e.costPerEdit.toFixed(2)}/edit · ${Math.round(e.oneShotRate)}%`:''}`);}).join('')]);
  const A=cur.topActivities||[];
  if(A.length) S.push(['Activities',`${esc(A[0].name)} · ${usd(A[0].cost)}`,A.map(a=>li(esc(a.name),`${usd(a.cost)} · ${nf(a.turns)} turns`)).join('')]);
  const TL=(cur.tools||[]).slice(0,6), MC=(cur.mcpServers||[]).slice(0,6);
  if(TL.length||MC.length) S.push(['Tools and MCPs',TL.length?`${esc(TL[0].name)} · ${nf(TL[0].calls)}`:'',TL.map(t=>li(esc(t.name),nf(t.calls))).join('')+MC.map(m=>li(`${esc(mcpName(m.name))} <span class="muted">MCP</span>`,nf(m.calls))).join('')]);
  const SK=(cur.skills||[]).slice(0,6), SA=cur.subagents||[];
  if(SK.length||SA.length) S.push(['Skills and subagents',SK.length?`${esc(SK[0].name)} · ${usd(SK[0].cost)}`:'',SK.map(k=>li(esc(k.name),`${usd(k.cost)} · ${nf(k.turns)} turns`)).join('')+SA.map(a=>li(`${esc(a.name)} <span class="muted">subagent</span>`,`${usd(a.cost)} · ${nf(a.calls)} calls`)).join('')]);
  const rt=cur.retryTax, rw=cur.routingWaste, wf=cur.workflow;
  if(rt||rw||wf){
    const waste=(rt?rt.totalUSD||0:0)+(rw?rw.totalSavingsUSD||0:0);
    let b='';
    if(rt) b+=li('Retries',`${usd(rt.totalUSD)} · ${nf(rt.retries)}`,'warn');
    if(rw&&rw.baselineModel) b+=li(`Pricier model where ${esc(rw.baselineModel)} would do`,usd(rw.totalSavingsUSD),'warn');
    if(wf){ b+=li('Corrections asked for',nf(wf.corrections)); if(wf.medianTimeToFirstEditMs) b+=li('Time to first edit',`${(wf.medianTimeToFirstEditMs/60000).toFixed(1)} min`); }
    S.push(['Waste',`<span class="warn">${usd(waste)}</span>`,b]);
  }
  const RF=cur.topReworkedFiles||[];
  if(RF.length) S.push(['Reworked files',`${esc(base(RF[0].path))} · ${nf(RF[0].edits)}`,RF.slice(0,6).map(f=>li(esc(base(f.path)),`${nf(f.edits)} edits · ${nf(f.sessions)} sessions`)).join('')]);
  secs.innerHTML=S.map(([t,val,body],i)=>`<details name="sec" data-t="${esc(t)}"${openSec===t?' open':''}><summary><span class="chev">›</span>${esc(t)}<span class="val">${val}</span></summary><div class="body">${body}</div></details>`).join('');
  secs.querySelectorAll('details').forEach(d=>d.addEventListener('toggle',()=>{ if(d.open) openSec=d.dataset.t; else if(openSec===d.dataset.t) openSec=null; report(); }));
  paintHeat(); report();
}

// ---- activity grid: 26 weeks, one square a day, from codeburn's session list ----
const metricOf={s:d=>d.s, tok:d=>d.in+d.out+d.cr+d.cw, c:d=>d.c, k:d=>d.k};
const fmtOf={s:v=>nf(v)+' sessions', tok:v=>tok(v)+' tokens', c:v=>usd(v), k:v=>nf(v)+' calls'};
function ymd(d){ return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function buildHeat(){
  const today=new Date(); today.setHours(12,0,0,0);
  const start=new Date(today); start.setDate(today.getDate()-today.getDay()-7*25);
  const cells=[], months=[];
  for(let w=0;w<26;w++){
    const first=new Date(start); first.setDate(start.getDate()+7*w);
    if(first.getDate()<=7) months.push(`<span style="grid-column:${w+1}">${first.toLocaleString('en-US',{month:'short'})}</span>`);
    for(let r=0;r<7;r++){
      const d=new Date(start); d.setDate(start.getDate()+7*w+r);
      const k=ymd(d), cls=d>today?'fut':(k===ymd(today)?'today':'');
      cells.push(`<i data-d="${k}" class="${cls}" style="grid-column:${w+1};grid-row:${r+1}"></i>`);
    }
  }
  document.getElementById('months').innerHTML=months.join('');
  document.getElementById('heat').innerHTML=cells.join('');
  document.querySelectorAll('#heat i:not(.fut)').forEach(c=>{
    c.addEventListener('mouseenter',()=>showTip(c)); c.addEventListener('mouseleave',()=>{tip.style.display='none';});
  });
}
function paintHeat(){
  const days=(cb.days||{})[prov]||{}, cells=[...document.querySelectorAll('#heat i')];
  const vals=cells.map(c=>days[c.dataset.d]?metricOf[metric](days[c.dataset.d]):0), mx=Math.max(...vals,1);
  cells.forEach((c,i)=>{ if(c.classList.contains('fut'))return; const f=vals[i]/mx; c.style.background=RAMP[vals[i]===0?0:f<.15?1:f<.35?2:f<.65?3:4]; });
  const act=cells.filter(c=>days[c.dataset.d]), total=act.reduce((a,c)=>a+metricOf[metric](days[c.dataset.d]),0);
  document.getElementById('heat-sum').textContent=act.length?`${act.length} active days · ${fmtOf[metric](total)} in 26 weeks`:'no history yet';
  const best=act.reduce((a,c)=>!a||metricOf[metric](days[c.dataset.d])>metricOf[metric](days[a.dataset.d])?c:a,null);
  document.getElementById('peak').textContent=best?`Peak: ${best.dataset.d.slice(8)}/${best.dataset.d.slice(5,7)} · ${fmtOf[metric](metricOf[metric](days[best.dataset.d]))}`:'';
}
const tip=document.getElementById('tip');
function showTip(c){
  const key=c.dataset.d, d=((cb.days||{})[prov]||{})[key], dt=new Date(key+'T12:00');
  let h=`<div class="t-h">${DOW[dt.getDay()]}, ${key.slice(8)}/${key.slice(5,7)}/${key.slice(0,4)}${c.classList.contains('today')?' · today':''}</div>`;
  if(!d) h+=`<div class="t-sub">No recorded activity</div>`;
  else{
    const by=Object.entries(d.by||{}).map(([k,n])=>`${NAMES[k]||k} ${nf(n)}`).join(' · ');
    h+=`<div class="t-sub">${nf(d.s)} sessions${prov==='all'&&by?' · '+esc(by):''}</div><div class="g">
      <div><span>API cost</span><b>${usd(d.c)}</b></div><div><span>Calls</span><b>${nf(d.k)}</b></div>
      <div><span>Turns</span><b>${nf(d.t)}</b></div><div><span>Tokens</span><b>${tok(d.in+d.out+d.cr+d.cw)}</b></div>
      <div><span>Input / output</span><b>${tok(d.in)} / ${tok(d.out)}</b></div><div><span>Cache read / write</span><b>${tok(d.cr)} / ${tok(d.cw)}</b></div></div>`;
    if(d.p&&d.p.length) h+=`<h5>Projects</h5>`+d.p.map(([n,v])=>li(esc(n),usd(v))).join('');
    if(d.m&&d.m.length) h+=`<h5>Models</h5><div class="li"><span>${esc(d.m.join(' · '))}</span><span></span></div>`;
  }
  tip.innerHTML=h; tip.style.display='block';
  const panel=document.getElementById('panel').getBoundingClientRect(), heat=document.getElementById('heat').getBoundingClientRect(), r=c.getBoundingClientRect();
  const W=tip.offsetWidth, H=tip.offsetHeight;
  let x=r.left+r.width/2-W/2-panel.left; x=Math.max(8,Math.min(x,panel.width-W-8));
  let y=heat.top-panel.top-H-8; if(y<8) y=heat.bottom-panel.top+8; // above the grid, or below when there is no room
  tip.style.left=x+'px'; tip.style.top=y+'px';
}

// ---- wiring ----
let lastH=0;
function report(){ requestAnimationFrame(()=>{ const h=Math.ceil(document.getElementById('panel').getBoundingClientRect().height)+2; if(Math.abs(h-lastH)>1){ lastH=h; invoke('consumo_height',{h}).catch(()=>{}); } }); }
document.getElementById('prov').addEventListener('click',e=>{const s=e.target.closest('span'); if(s){prov=s.dataset.v; render();}});
document.getElementById('per').addEventListener('click',e=>{const s=e.target.closest('span'); if(s){per=s.dataset.v; render();}});
document.getElementById('metric').addEventListener('click',e=>{const s=e.target.closest('span'); if(!s)return; metric=s.dataset.m; document.querySelectorAll('#metric span').forEach(x=>x.classList.toggle('on',x===s)); paintHeat();});
const close=()=>invoke('close_consumo').catch(()=>{});
document.getElementById('close').addEventListener('click',close);
document.addEventListener('keydown',e=>{ if(e.key==='Escape') close(); });
listen('codeburn',e=>{ if(e.payload){ cb=e.payload; render(); } }).catch(()=>{});
listen('consumo_open',e=>{ if(e.payload){ prov=e.payload; render(); } }).catch(()=>{});
buildHeat();
invoke('get_codeburn').then(v=>{ if(v){ cb=v; } render(); }).catch(()=>render());
</script>
</body></html>
