<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  /* Visual reference: upstream docs/specs/2026-08-28-usage-notch-design.md, reproduced for Windows */
  *{box-sizing:border-box} /* content-box padding once pushed the card past the window's left edge */
  html,body{margin:0;padding:0;width:100%;height:100%;background:transparent;overflow:hidden;user-select:none}
  body{font-family:"Segoe UI",system-ui,sans-serif;color:#fff}
  #root{position:relative;width:100%;height:100%}

  /* The pill on the right edge */
  #pill{
    position:absolute;right:0;top:50%;transform:translateY(-50%);
    width:84px;padding:18px 0;background:#000;
    border-radius:20px 0 0 20px;
    /* Stays visible on dark wallpapers: a thin stroke plus a faint glow, the only outline when black sits on black */
    border:1px solid #2e2e2e;border-right:none;
    box-shadow:none;
    display:flex;flex-direction:column;align-items:center;gap:14px;cursor:pointer;
  }
  /* Fillets: the concave arcs between the pill's top/bottom and the screen edge (the inverse rounded
     corner in the upstream design frame). An R×R black square hugs the edge and a radial gradient
     punches out the circle of radius R centred on its outer corner; what remains is the arc. A 1 px
     ring in the stroke colour joins the pill's own stroke (the outline cue on black wallpapers). */
  #pill::before,#pill::after{
    content:"";position:absolute;right:0;width:var(--fillet);height:var(--fillet);pointer-events:none;
  }
  #pill{--fillet:26px}
  #pill::before{
    top:calc(-1 * var(--fillet)); /* covers the 1 px stroke along the pill's top edge so there is no seam */
    background:radial-gradient(circle at 0 0, transparent calc(var(--fillet) - 1.5px), #2e2e2e calc(var(--fillet) - 0.5px), #000 calc(var(--fillet) + 0.5px));
  }
  #pill::after{
    bottom:calc(-1 * var(--fillet));
    background:radial-gradient(circle at 0 100%, transparent calc(var(--fillet) - 1.5px), #2e2e2e calc(var(--fillet) - 0.5px), #000 calc(var(--fillet) + 0.5px));
  }
  .cell{display:flex;flex-direction:column;align-items:center;gap:6px;width:100%}
  .ringwrap{position:relative;width:56px;height:56px}
  .ringwrap > svg.ring{position:absolute;inset:0;overflow:visible} /* pins only the ring itself; an inline logo svg must not match this or it ends up in the top-left corner */
  .glyph{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-size:20px;font-weight:700;color:#e8e8ea;letter-spacing:-.5px;
  }
  .glyph.small{font-size:15px}
  /* Glyphs: mark = the provider's own brand mark (monochrome, shown white); appicon = the installed app's icon (colour, rounded and shrunk) */
  .glyph img,.glyph svg{display:block;pointer-events:none;user-select:none}
  .glyph .mark{display:block;width:26px;height:26px;color:#e8e8ea}
  .glyph .mark svg{width:26px;height:26px;fill:currentColor} /* inline SVG follows currentColor, so it dims together with the cell */
  .glyph img.png{width:26px;height:26px;object-fit:contain}
  .glyph img.appicon{width:30px;height:30px;border-radius:8px;object-fit:cover}
  .c-head .mark{display:inline-block;width:16px;height:16px;color:#e8e8ea;margin-right:2px}
  .c-head .mark svg{width:16px;height:16px;fill:currentColor}
  .pct{font-size:14px;font-weight:600;color:#fff;font-variant-numeric:tabular-nums}
  /* Fold: the tab on the pill's left edge slides the pill off the screen, leaving #fold (the same
     tab, chevron reversed) on the edge to bring it back. One SVG outline: concave fillets flowing
     into the tab, its fill covering the pill's own stroke there, so only the curve shows. */
  #pill{transition:right .18s ease}
  #root.folded #pill{right:-130px;pointer-events:none}
  .tab{position:absolute;left:-16px;top:50%;transform:translateY(-50%);width:18px;height:58px;cursor:pointer;z-index:2}
  .tab svg,#fold svg{display:block}
  .tab .chev,#fold .chev{stroke:#9a9a9a}
  .tab:hover .chev,#fold:hover .chev{stroke:#fff}
  #card.show ~ #pill .tab{visibility:hidden} /* the card's own pointer would land right on it */
  #fold{display:none;position:absolute;right:0;top:50%;transform:translateY(-50%);width:18px;height:58px;cursor:pointer}
  #root.folded #fold{display:block}
  /* Two readings under a split ring: 5-hour on the left, weekly on the right */
  .pct.split{display:flex;justify-content:space-evenly;width:100%}
  .dim{opacity:.55}
  /* Session arc animation */
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
  /* A 60 fps SVG transform animation in a transparent always-on-top window slows the whole desktop
     compositor (other apps stutter). steps() drops repaints to ~10 fps; it still reads as spinning/breathing. */
  .arc-spin{animation:spin 1.2s steps(12) infinite;transform-origin:center}
  .arc-pulse{animation:pulse 1.1s steps(6) infinite}
  /* Windows' Animation effects switch: a still arc and a solid ring, as on the Mac under Reduce Motion */
  @media (prefers-reduced-motion: reduce){.arc-spin,.arc-pulse{animation:none}}

  /* Hover card, shown to the left of the pill */
  #card{
    position:absolute;left:10px;right:114px;top:50%;transform:translateY(-50%);
    /* Anchored on both sides = fluid width: whatever the WebView's real logical width, the card cannot
       extend past the window's left edge (a fixed max-width got clipped when the DPI disagreed).
       The 246 cap matches the upstream spec. */
    max-width:246px;margin-left:auto;background:#0a0a0a;border-radius:16px;padding:16px;
    overflow-wrap:anywhere;min-width:0;
    max-height:calc(100% - 16px);overflow:hidden; /* never taller than the window, however short it is */
    display:none;
  }
  #card.show{display:block}
  /* The tail, its point on the hovered ring: the Mac's curved wedge (TooltipTail), whose shoulders
     leave the card tangent to its edge so the two read as one shape. An element of its own rather
     than ::after, so the card's overflow cannot clip it and it can be reported as hot. It spans the
     whole gap, its tip tucked 1 px under the pill's edge so the two meet. */
  #tail{
    position:absolute;right:83px;width:32px;height:36px;background:#0a0a0a;display:none;
    clip-path:path('M0 0C0 9 18.56 13.68 32 18C18.56 22.32 0 27 0 36Z');
  }
  #card.show + #tail{display:block}
  .c-head{display:flex;align-items:center;gap:8px;margin-bottom:4px}
  .c-title{font-size:14px;font-weight:700}
  .c-sub{font-size:11px;color:#808080;margin-bottom:10px}
  .win{margin-top:10px}
  .w-row{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;flex-wrap:wrap;column-gap:8px}
  .w-label{color:#e8e8ea;font-weight:600;white-space:nowrap}
  .w-reset{color:#808080;font-size:11px;white-space:nowrap;margin-left:auto} /* wrap as a whole when it does not fit; never break inside a word */
  .w-track{height:4px;border-radius:2px;background:#2d2d2d;margin:6px 0 4px;overflow:hidden}
  .w-fill{height:100%;border-radius:2px}
  .w-used{font-size:11px;color:#808080}
  .g-head{font-size:12px;font-weight:700;color:#e8e8ea;margin-top:12px}
  .g-box{border:1px solid #242424;border-radius:10px;padding:0 10px 8px;margin-top:6px}
  .c-note{font-size:12px;color:#c8c8c8;line-height:1.5;margin-top:6px}
  .c-sessions{margin-top:12px;border-top:1px solid #1e1e1e;padding-top:8px}
  .s-row{display:flex;align-items:center;gap:6px;font-size:11px;color:#b0b0b3;padding:2px 0}
  .s-dot{width:6px;height:6px;border-radius:3px;flex:0 0 auto}
  .s-more{font-size:11px;color:#808080;padding:2px 0}
  /* Size slider — the last row of the hover card. Only the pill is scaled, so this row keeps its
     own size and does not move out from under the cursor while it is being dragged. */
  /* NOVARC cell: the design system's negative symbol in a ring-sized box */
  .brand .glyph svg{width:56px;height:52px}
  /* Consumo (codeburn) inside a provider's card */
  .cb{margin-top:12px;border-top:1px solid #1e1e1e;padding-top:10px}
  .cb-h{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;font-weight:700;color:#e8e8ea}
  .cb-h em{font-style:normal;font-weight:400;color:#808080;font-size:10.5px}
  .cb-tabs{display:flex;gap:3px;background:#151515;border-radius:8px;padding:2px;margin:8px 0}
  .cb-tabs span{flex:1;text-align:center;padding:3px 0;border-radius:6px;color:#9a9a9a;font-size:10.5px;cursor:pointer}
  .cb-tabs span.on{background:#2a2a2a;color:#fff;font-weight:600}
  .cb-kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
  .cb-kpi{background:#151515;border-radius:8px;padding:5px 7px}.cb-kpi span{display:block;color:#808080;font-size:9.5px}.cb-kpi b{color:#fff;font-size:13px;font-variant-numeric:tabular-nums}
  .cb-chart{display:flex;align-items:flex-end;gap:2px;height:34px;border-bottom:1px solid #262626;margin-top:8px}
  .cb-chart i{flex:1;border-radius:2px 2px 0 0;min-height:1px;display:block}
  .cb-sub{font-size:10.5px;font-weight:700;color:#bdbdbd;margin:8px 0 3px}
  .cb-row{display:grid;grid-template-columns:78px 1fr 40px;align-items:center;gap:6px;font-size:11px;margin:2px 0;color:#cfcfcf}
  .cb-row span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .cb-row .t{height:4px;background:#262626;border-radius:2px;overflow:hidden}.cb-row .t div{height:100%;border-radius:2px}
  .cb-row .v{text-align:right;color:#9a9a9a;font-variant-numeric:tabular-nums}
  .cb-more{display:block;text-align:right;margin-top:8px;color:#ff9a4a;font-size:11.5px;font-weight:600;cursor:pointer}
  .cb-big{font-size:26px;font-weight:700;color:#fff;margin:4px 0 6px;font-variant-numeric:tabular-nums}
  .c-scale{display:flex;align-items:center;gap:8px;margin-top:10px;padding-top:8px;border-top:1px solid #1e1e1e}
  .c-scale input[type=range]{-webkit-appearance:none;appearance:none;flex:1;height:3px;border-radius:2px;background:#2d2d2d;outline:none}
  .c-scale input[type=range]::-webkit-slider-runnable-track{height:3px;border-radius:2px;background:#2d2d2d}
  .c-scale input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:10px;height:10px;margin-top:-3.5px;border-radius:50%;background:#8a8a8a;cursor:pointer}
  .c-scale-val{font-size:10px;color:#808080;min-width:30px;text-align:right}
  .c-gear{display:inline-flex;margin-left:4px;padding:2px;border-radius:4px;color:#808080;cursor:pointer;line-height:0}
  .c-gear:hover{color:#e8e8ea;background:#1e1e1e}
  .c-gear svg{width:13px;height:13px}

  /* Companion cell: the sprite inside an XP ring (progress of the current form) */
  .cell.mon .glyph img{width:44px;height:44px;image-rendering:pixelated;object-fit:contain}
  .cell.mon .pct{font-size:12.5px}
  .cell.mon.tired .glyph img{filter:saturate(.4)}
  .cell.mon.sleep{opacity:.55}.cell.mon.sleep .glyph img{filter:grayscale(.6)}
  .cell.mon .zz{position:absolute;right:-6px;top:-8px}
  .cell.mon .spark{position:absolute;right:-4px;top:-6px}
  @keyframes flash{0%{opacity:0}20%{opacity:.9}100%{opacity:0}}
  .cell.mon .flash{position:absolute;inset:-4px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.7),rgba(255,255,255,0) 70%);animation:flash 1.2s ease-out 1;pointer-events:none}
  /* Hero mode: the companion big at the top of the pill, its name under it */
  .cell.mon.hero .ringwrap{width:68px;height:68px}
  .cell.mon.hero .glyph img{width:56px;height:56px}
  .cell.mon.hero .mon-name{font-size:11px;font-weight:700;color:#e8e8ea;margin-top:-2px}
  .cell.mon.hero .pct{color:#9a9a9a;font-weight:600}
  .cell.spend .pct-lab{font-size:10px;color:#808080;margin-bottom:-4px}
  /* Event bubble (hatch, evolution, candy): left of the pill, beside the companion cell */
  #bubble{position:absolute;right:112px;width:180px;background:#0a0a0a;border:1px solid #2e2e2e;border-radius:12px;padding:8px 10px;font-size:11px;color:#e8e8ea;line-height:1.4;display:none;z-index:3}
  #bubble:after{content:"";position:absolute;right:-7px;top:50%;margin-top:-6px;border:6px solid transparent;border-left-color:#0a0a0a;border-right:0}
  #bubble.show{display:block}
  #bubble b{color:#fff}
  /* Companion card */
  .m-hero{display:flex;gap:12px;align-items:flex-start}
  .m-pic{width:72px;height:72px;background:#151515;border-radius:12px;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
  .m-pic img{width:64px;height:64px;image-rendering:pixelated;object-fit:contain}
  .m-pic.shiny{box-shadow:inset 0 0 0 1px #6b5a10}
  .badge{display:inline-block;font-size:9px;font-weight:800;letter-spacing:.3px;padding:2px 7px;border-radius:9px;color:#fff;vertical-align:middle;margin-left:6px}
  .m-sub{font-size:11px;color:#9a9a9a;font-weight:600;margin-top:2px}
  .xp{height:8px;border-radius:4px;background:#2d2d2d;overflow:hidden;margin-top:6px}.xp div{height:100%;border-radius:4px;background:#e8e8ea}
  .m-left{font-size:11px;color:#808080;margin-top:3px}
  .m-mood{font-size:12px;color:#c8c8c8;margin-top:8px;font-weight:600}
  .evo{display:flex;align-items:center;gap:6px;margin-top:8px;flex-wrap:wrap}
  .evo .n{display:flex;flex-direction:column;align-items:center;gap:1px}
  .evo .n img{width:36px;height:36px;image-rendering:pixelated;object-fit:contain}
  .evo .n.future img,.evo .n.mystery img{filter:brightness(0) invert(.3)}
  .evo .n i{width:5px;height:5px;border-radius:3px;background:transparent;display:block}
  .evo .n.current i{background:#0a84ff}
  .evo svg{width:14px;height:14px}
  #notice{
    position:absolute;left:8px;bottom:6px;right:80px;font-size:10px;color:#808080;
    background:rgba(0,0,0,.85);border-radius:8px;padding:4px 8px;display:none
  }
  #notice.show{display:block}
</style>

<div id="root">
  <div id="card"></div>
  <div id="tail"></div>
  <div id="pill"></div><!-- one .cell per provider, stacked vertically (upstream: data-driven, the same layout for 1–5 cells) -->
  <div id="fold" title="Show"><svg viewBox="0 0 18 58" width="18" height="58"><path d="M16.5 0 A6 6 0 0 1 10.5 6 H7.5 A7 7 0 0 0 0.5 13 V45 A7 7 0 0 0 7.5 52 H10.5 A6 6 0 0 1 16.5 58 H18 V0 Z" fill="#000"/><path d="M16.5 0 A6 6 0 0 1 10.5 6 H7.5 A7 7 0 0 0 0.5 13 V45 A7 7 0 0 0 7.5 52 H10.5 A6 6 0 0 1 16.5 58" fill="none" stroke="#2e2e2e" stroke-width="1"/><path class="chev" d="M10 25 L6.5 29 L10 33" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></div><!-- the only thing left on screen while the pill is folded away -->
  <div id="bubble"></div>
  <div id="notice"></div>
</div>
<script>
const invoke = window.__TAURI__.core.invoke;
const listen = window.__TAURI__.event.listen;

/* Colour ramp (upstream palette values) */
const AMPLE='#00FF88', WATCH='#F2FF00', CRIT='#FF3F00';
const TRACK='#303030', AMBER='#FFBF00', RUNGREEN='#28E07B';
// A continuous ramp through the three brand tones: green at 0, yellow at half, red at 100 %
function mix(a,b,t){
  const c=(h,i)=>parseInt(h.slice(1+2*i,3+2*i),16);
  return '#'+[0,1,2].map(i=>Math.round(c(a,i)+(c(b,i)-c(a,i))*t).toString(16).padStart(2,'0')).join('');
}
const tone=f=>{ const v=Math.min(Math.max(f,0),1); return v<0.5?mix(AMPLE,WATCH,v/0.5):mix(WATCH,CRIT,(v-0.5)/0.5); };
// Whole percents, except where rounding would read as nothing used or nothing left, as the Mac's Percent does
function smallPct(v){
  if(v<=0) return '0';
  const t=Math.round(v*10)/10;
  if(t<0.1) return '<0.1';
  if(t>99.9) return '>99.9';
  return t.toFixed(1);
}
function pctText(f){ const v=f*100; return v>0&&v<1?smallPct(v):String(Math.round(v)); }
// Both ends, since vendors disagree on which they print; the left half comes from the rounded used half, as their dashboards do
function usedCopy(w){
  const v=w.used*100;
  let used, left;
  if((v>0&&v<1)||(v>99&&v<100)){ used=smallPct(v); left=100-v>99.9?'>99.9':smallPct(Math.max(0,100-v)); }
  else { const u=Math.round(v); used=String(u); left=String(Math.max(0,100-u)); }
  if(w.derived) used='~'+used;
  if(uiLang==='pt') return `${used}% usado · ${left}% restante`;
  return uiLang==='ru'?`Использовано ${used}% · осталось ${left}%`:`${used}% Used · ${left}% left`;
}

let usage={status:'',windows:[],fetched_at:0,note:''};
let codexSnap={status:'absent',windows:[],fetched_at:0,note:''};
let cursorSnap={status:'absent',windows:[],fetched_at:0,note:''};
let agSnap={status:'absent',windows:[],fetched_at:0,note:''};
let claudeAccounts=[]; // Claude accounts Desktop is signed into besides the `claude` cell's: [{id:'claude:<org8>',name,snap}]
// codeburn (API-equivalent spend): the NOVARC cell and the Consumo section of the Claude and Codex cards
let cb={available:false,last24h:null,periods:{},days:{},updated_at:0};
let cardPeriod='today';
// The companion: its view from Rust, the pill/card preferences, the token snapshot and the sprites
let comp=null, cprefs={pillMode:'cell',animation:'balanced',limitDisplay:'used',notifications:true}, tokSnap=null;
const SPR={}, sprPending=new Set();
function sprUrl(id,anim,shiny){
  const k=`${id}|${anim?1:0}|${shiny?1:0}`;
  if(SPR[k]) return SPR[k];
  if(!sprPending.has(k)){ sprPending.add(k); invoke('get_sprite',{what:String(id),animated:!!anim,shiny:!!shiny}).then(u=>{ sprPending.delete(k); if(u){ SPR[k]=u; renderRing(); if(card.classList.contains('show')) renderCard(); } }).catch(()=>sprPending.delete(k)); }
  return SPR[`${id}|0|${shiny?1:0}`]||'';
}
// PokeTokenBar's compact tokens: 12.3K, 190.6M, 1.24B
function tokFmt(n){ n=Number(n)||0; const trim=(v,d)=>{let s=v.toFixed(d); while(s.endsWith('0')) s=s.slice(0,-1); if(s.endsWith('.')) s=s.slice(0,-1); return s;};
  if(n<1e3) return String(n); if(n<1e6) return trim(n/1e3,1)+'K'; if(n<1e9) return trim(n/1e6,1)+'M'; return trim(n/1e9,2)+'B'; }
const RAR={common:'#8e8e93',uncommon:'#34c759',rare:'#0a84ff',legendary:'#ff9f0a'};
const NAT={hardy:['Hardy','Esforçada'],lonely:['Lonely','Carente'],brave:['Brave','Corajosa'],adamant:['Adamant','Teimosa'],naughty:['Naughty','Levada'],bold:['Bold','Ousada'],docile:['Docile','Dócil'],relaxed:['Relaxed','Descontraída'],impish:['Impish','Travessa'],lax:['Lax','Despreocupada'],timid:['Timid','Medrosa'],hasty:['Hasty','Apressada'],serious:['Serious','Séria'],jolly:['Jolly','Alegre'],naive:['Naive','Ingênua'],modest:['Modest','Modesta'],mild:['Mild','Meiga'],quiet:['Quiet','Discreta'],bashful:['Bashful','Tímida'],rash:['Rash','Impulsiva'],calm:['Calm','Calma'],gentle:['Gentle','Gentil'],sassy:['Sassy','Atrevida'],careful:['Careful','Cautelosa'],quirky:['Quirky','Excêntrica']};

// "Is it working?" per provider: Claude from the four-state engine, the others from the activity probe. Returns running | attention | idle
function workState(id){
  if(id==='claude'){
    if(stateSnap.agg==='running') return 'running';
    if(stateSnap.agg==='attention') return 'attention';
    // The engine cannot see cloud sessions: fall back to the desktop app's network activity
    if(activity.some(a=>a.provider==='claude'&&a.state==='busy')) return 'running';
    return 'idle';
  }
  const acts=activity.filter(a=>a.provider===id);
  if(acts.some(a=>a.state==='waiting')) return 'attention';
  if(acts.some(a=>a.state==='busy')) return 'running';
  return 'idle';
}
function glyphOf(p){ return glyphs[p.glyphId||p.id]; }
function glyphHtml(p,small){
  const g=glyphOf(p);
  if(g&&g.kind==='svg'&&g.svg) return `<span class="mark">${g.svg}</span>`;
  if(g&&g.url) return `<img class="${g.kind}" src="${g.url}" alt="${p.name}"${small?' style="width:16px;height:16px;border-radius:4px"':''}>`;
  return small?'':p.glyph; // fallback letter
}

let notchSlots=null;
function slotFor(id){
  if(!Array.isArray(notchSlots)) return null;
  for(const s of notchSlots){ if(s&&s.provider===id) return s; }
  return null;
}
function providers(){
  const list=[{id:'claude',name:'Claude',glyph:'C',snap:usage}];
  for(const a of claudeAccounts) list.push({id:a.id,name:a.name,glyph:'C',glyphId:'claude',snap:a.snap});
  if(codexSnap.status!=='absent') list.push({id:'codex',name:'Codex',glyph:'Cx',snap:codexSnap});
  if(cursorSnap.status!=='absent') list.push({id:'cursor',name:'Cursor',glyph:'Cu',snap:cursorSnap});
  if(agSnap.status!=='absent') list.push({id:'gemini',name:'Antigravity',glyph:'Ag',snap:agSnap});
  if(Array.isArray(notchSlots)&&notchSlots.length){
    const picked=list.filter(p=>!!slotFor(p.id));
    // Never leave the notch with nothing in it: an empty result means the choice no longer matches
    // any available provider, so fall back to showing everything rather than an empty pill.
    if(picked.length) return picked;
  }
  return list;
}

function tightestOf(ws){
  return ws.filter(w=>w.count==null).reduce((a,b)=>!a||b.used>a.used||(b.used===a.used&&b.id<a.id)?b:a,null);
}
function laneFamily(w){ const id=w.id.toLowerCase(); return id.startsWith('gemini')?'gemini':(id.startsWith('3p')||id.startsWith('claude'))?'3p':''; }
function laneIs(w,limit){
  const t=(w.id+' '+w.label).toLowerCase();
  return limit==='weekly'?t.includes('weekly'):['5h','5-hour','five hour','five-hour','hourly','session'].some(k=>t.includes(k));

function weeklyOf(ws,id){
  if(id==='claude'||id.startsWith('claude:')) return ws.find(w=>w.id==='weekly_all')||ws.find(w=>w.id==='seven_day')||null;
  if(id==='codex') return ws.find(w=>w.label==='Weekly limit')||null;

// The 5-hour window, for the split ring. Null where a provider has none, and the ring stays whole
function fiveHourOf(ws,id){
  if(id==='claude'||id.startsWith('claude:')) return ws.find(w=>w.id==='session')||null;
  if(id==='codex') return ws.find(w=>w.label==='5h limit')||null;

function headlineOf(snap,id){
  const ws=snap.windows; if(!ws.length) return null;
  if(ringReads==='weekly'){ const w=weeklyOf(ws,id); if(w) return w; }
  const byId=x=>ws.find(w=>w.id===x)||null;
  if(id==='claude'||id.startsWith('claude:')) return byId('session');
  if(id==='codex') return ws[0];
  if(id==='cursor') return byId('included')||byId('api');
  const fam=ws.filter(w=>laneFamily(w)===agPrefs.model), lanes=fam.length?fam:ws;
  if(agPrefs.limit!=='automatic'){ const w=tightestOf(lanes.filter(w=>laneIs(w,agPrefs.limit))); if(w) return w; }
  return tightestOf(lanes.filter(w=>w.used<1))||tightestOf(lanes)||lanes[0];
}

      inner+=svgArc(25,half(week),tone(week.used),5);

      inner+=`<line x1="28" y1="0.5" x2="28" y2="5.5" stroke="#000" stroke-width="1.5"/><line x1="28" y1="50.5" x2="28" y2="55.5" stroke="#000" stroke-width="1.5"/>`;
    }else if(h && h.count==null) inner+=svgArc(25,Math.min(h.used,1),tone(h.used),5);
    { // thin inner arc: spinning = working, amber pulse = waiting on you (one animation for all four, different sources)
      const ws=workState(p.id);
      if(ws==='running') inner+=`<g class="arc-spin">${svgArc(19,0.28,RUNGREEN,2.5)}</g>`;
      else if(ws==='attention') inner+=`<g class="arc-pulse"><circle cx="28" cy="28" r="19" fill="none" stroke="${AMBER}" stroke-width="2.5"/></g>`;
    }
    svg.innerHTML=inner;
    pct.classList.toggle('split',split);
    const label=w=>(w.derived?'~':'')+pctText(w.used)+'%';
    if(split) pct.innerHTML=`<span>${label(five)}</span><span>${label(week)}</span>`;
    else if(p.snap.status==='needsAuth'||p.snap.status==='none') pct.textContent='—';
    else if(h && h.count!=null) pct.textContent='~'+h.count;
    else if(h) pct.textContent=(h.derived?'~':'')+pctText(h.used)+'%';
    else pct.textContent=p.snap.windows.length?'—':'…'; // its declared window is missing: a dash, not a wait
    // Spent is either window at its limit: the 5-hour one blocks just as the weekly one does
    glyph.classList.toggle('dim', split ? (five.used>=1||week.used>=1) : !!(h && h.used>=1));
    wrap.classList.toggle('dim', staleOf(p.snap));
  }
  reportHot(); // a provider appearing or leaving resizes the pill
}

function resetCopy(ms){
  if(!ms) return '';
  const diff=ms-Date.now();
  if(diff<=0) return uiLang==='ru'?'Сброс…':uiLang==='pt'?'Reiniciando…':'Resetting…';
  const min=Math.round(diff/60000); // rounded before the test, so 59m40s never reads "Resets in 60 min"
  if(min<60) return uiLang==='ru'?`Сброс через ${Math.max(1,min)} мин`:uiLang==='pt'?`Reinicia em ${Math.max(1,min)} min`:`Resets in ${Math.max(1,min)} min`;
  const d=new Date(ms);
  const locale=uiLang==='ru'?'ru-RU':uiLang==='pt'?'pt-BR':'en-US';
  const resets=uiLang==='ru'?'Сброс:':uiLang==='pt'?'Reinicia':'Resets';
  // A weekday only names a day in the coming week: a Codex monthly reset 26 days out read as this Monday
  if(daysApart(Date.now(),ms)>=7) return `${resets} ${d.toLocaleDateString(locale,{month:'short',day:'numeric'})}`;
  const t=d.toLocaleTimeString(locale,{hour:'numeric',minute:'2-digit',hourCycle:stateSnap.clock_24h?'h23':'h12'});
  if(diff<24*60*60*1000) return `${uiLang==='ru'?'Сброс в':uiLang==='pt'?'Reinicia às':'Resets at'} ${t}`;
  return `${resets} ${d.toLocaleDateString(locale,{weekday:'short'})} ${t}`;
}
// Calendar days rather than 24-hour blocks, so a clock change cannot move the answer
function daysApart(from,to){
  const day=ms=>{const d=new Date(ms); return new Date(d.getFullYear(),d.getMonth(),d.getDate()).getTime();};
  return Math.round((day(to)-day(from))/86400000);
}

function ago(ms){
  const m=Math.round((Date.now()-ms)/60000);
  if(uiLang==='ru') return m<60?`${m} мин назад`:`${Math.round(m/60)} ч назад`;
  if(uiLang==='pt') return m<60?`${m} min atrás`:`${Math.round(m/60)} h atrás`;
  return m<60?`${m}m ago`:`${Math.round(m/60)}h ago`;
}

    // Waiting before busy, newest first within each, so what gets cut is what matters least
    const acts=activity.filter(a=>a.provider===p.id).sort((a,b)=>(b.state==='waiting')-(a.state==='waiting')||b.since-a.since);
    if(acts.length){

// The card follows the hovered cell: vertically centred on it (kept inside the window), tail pointing at it
function placeCard(){
  const cell=pill.querySelector(`.cell[data-p="${hoverId}"]`)||pill;
  const cr=cell.getBoundingClientRect();
  const cy=cr.top+cr.height/2;
  const H=innerHeight, ch=card.offsetHeight||0;
  let top=Math.round(cy-ch/2); top=Math.max(8,Math.min(top,H-ch-8));
  card.style.top=top+'px'; card.style.transform='none';
  // The tail's point on the hovered ring (not the cell, which includes the label below it), kept off the card's rounded corners
  const rr=(cell.querySelector('.ringwrap')||cell).getBoundingClientRect(), ry=rr.top+rr.height/2;
  const th=tail.offsetHeight||36, ty=Math.max(top+16+th/2,Math.min(top+ch-16-th/2,ry));

}

function callq(cmd,args){ // invoke with visible failure: any command error is reported on screen (a silent .catch used to swallow them)
  return invoke(cmd,args).catch(e=>{notice(cmd+' failed: '+(e&&e.message||e));throw e;});

// Hot rectangles are reported in physical pixels (multiplied by this page's real DPR), so the Rust side does no conversion — WebView2's DPR and the window scale can disagree
function rectOf(el){const r=el.getBoundingClientRect(),k=window.devicePixelRatio||1;return [r.left*k,r.top*k,r.width*k,r.height*k];}
/* Rust gates click-through on these, so they are reported whenever the pill or card moves, not only

function reportHot(){
  if(isFolded()){ callq('set_hot',{rects:[rectOf(foldTab)],expanded:false}).catch(()=>{}); return; }
  const open=card.classList.contains('show');
  // The tab sits outside the pill's box, so it is its own rectangle (hidden, and left out, under the card)
  const tabEl=pill.querySelector('.tab');
  const rects=open?[rectOf(pill),rectOf(tail),rectOf(card)]:[rectOf(pill)].concat(tabEl?[rectOf(tabEl)]:[]);
  callq('set_hot',{rects,expanded:open}).catch(()=>{});
}
/* ---- Notch size ---------------------------------------------------------
   The pill alone is scaled, with CSS `zoom` rather than `transform`: the pill is centred by
   `top:50%; transform:translateY(-50%)`, so assigning to `transform` here would wipe that out and
   throw the pill to the top of the screen. `zoom` changes the element's laid-out size instead, so
   the existing centring keeps working and `right:0` keeps it against the edge.
   The hover card is deliberately left at full size: it holds the slider, and a slider that shrank
   as it was dragged would slide out from under the cursor. */
function clampPct(v){const n=Math.round(Number(v));return isFinite(n)?Math.max(40,Math.min(100,n)):100;}
function applyPillScale(){ if(pill) pill.style.zoom=String(scalePct/100); }
function applyScale(v){
  scalePct=clampPct(v);
  const lab=document.getElementById('scale-val'); if(lab) lab.textContent=scalePct+'%';
  applyPillScale();                                       // draw it at once; do not wait on Rust
  // One save when the drag settles, not one per pixel: set_scale writes the config file and
  // broadcasts an event every time it is called. Same 150ms wait the settings window's slider uses.
  clearTimeout(scaleSaveT);
  scaleSaveT=setTimeout(()=>{invoke('set_scale',{scale:scalePct/100}).catch(()=>{});},150); // percent → fraction: 60 becomes 0.60
  // The pill just changed size, so the hot rectangles the watchdog checks are stale
  clearTimeout(scaleT);
  scaleT=setTimeout(()=>{if(card.classList.contains('show')){placeCard();armWatchdog();}},120);
}
function wireScaleRow(){
  const r=document.getElementById('scale-range'); if(!r) return;
  r.value=String(scalePct);
  r.addEventListener('input',()=>applyScale(r.value)); // live while dragging, and on arrow keys
  r.addEventListener('pointerdown',()=>{scaleDragging=true;});
  r.addEventListener('mousedown',()=>{scaleDragging=true;});
}
document.addEventListener('pointerup',()=>{scaleDragging=false;});
document.addEventListener('pointercancel',()=>{scaleDragging=false;});
document.addEventListener('mouseup',()=>{scaleDragging=false;});
function loadScale(){
  invoke('get_scale').then(v=>{
    const n=Number(v); if(isFinite(n)&&n>0) scalePct=clampPct(Math.round(n*100));
    applyPillScale(); wireScaleRow();
  }).catch(()=>{applyPillScale();});
}

function armWatchdog(){
  requestAnimationFrame(reportHot); // wait one frame so renderCard's new content is laid out before measuring
}
// Viewport fit (pure front-end fallback, independent of Rust): the window is NOTCH_W (360) × primary scale physical px,
// so if this page's CSS viewport is not 360 wide the WebView's DPR disagrees with the monitor; CSS zoom pulls the layout back to the design size.
function fitZoom(){
  const z=innerWidth/380;
  document.documentElement.style.zoom=(Math.abs(z-1)>0.02)?String(z):'';
  return z;
}
function reportDpr(){
  const z=fitZoom();
  jslog(`dpr=${window.devicePixelRatio} inner=${innerWidth}x${innerHeight} cssZoom=${z.toFixed(3)}`);
  callq('report_dpr',{dpr:window.devicePixelRatio||1,w:innerWidth,h:innerHeight}).catch(()=>{});
}
reportDpr();
window.addEventListener('resize',()=>{clearTimeout(window._dprT);window._dprT=setTimeout(()=>{reportDpr();reportHot();},120);});
matchMedia(`(resolution: ${window.devicePixelRatio}dppx)`).addEventListener('change',reportDpr);

/* Collapse test: no trust in element-level mouseenter/mouseleave/e.target at all —
   pure geometry: is the cursor (clientX/Y) inside pill rect ∪ card rect ∪ their bounding box?
   Leaving the window: document mouseout (relatedTarget=null) plus the Rust watchdog (system cursor) as a second line. */
function inRect(x,y,r,pad){return x>=r.left-pad&&y>=r.top-pad&&x<r.right+pad&&y<r.bottom+pad;}
function cellAt(x,y){
  for(const el of pill.querySelectorAll('.cell')){ if(inRect(x,y,el.getBoundingClientRect(),6)) return el.dataset.p; }
  return null;
}
function pointerInHot(x,y){
  if(isFolded()) return false; // folded: the tab brings the pill back, it never opens the card
  const p=pill.getBoundingClientRect();
  if(inRect(x,y,p,4))return true;
  if(!card.classList.contains('show'))return false;
  const c=card.getBoundingClientRect();
  if(inRect(x,y,c,4))return true;
  const u={left:Math.min(p.left,c.left),top:Math.min(p.top,c.top),right:Math.max(p.right,c.right),bottom:Math.max(p.bottom,c.bottom)};
  return inRect(x,y,u,0);
}
let hideLogged=0;
document.addEventListener('mousemove',e=>{
  if(dragging)return; // no card while dragging
  const hot=pointerInHot(e.clientX,e.clientY);
  if(hot){
    clearTimeout(hideTimer);
    const id=cellAt(e.clientX,e.clientY);
    if(id&&id!==hoverId){ hoverId=id; if(card.classList.contains('show')){ renderCard(); armWatchdog(); } }
    // Heading for the fold chevron is not asking for the card
    if(!card.classList.contains('show') && !(e.target.closest&&e.target.closest('.tab'))) showCard();
  }
  else if(card.classList.contains('show')){ if(hideLogged++<5) jslog(`mousemove left the hot area -> collapse at ${e.clientX},${e.clientY}`); scheduleHide(); }
});
document.addEventListener('mouseout',e=>{ // relatedTarget null = the cursor left the page
  if(!e.relatedTarget && card.classList.contains('show')){ if(hideLogged++<5) jslog('mouseout left the page -> collapse'); scheduleHide(); }
});
listen('pointer_left',()=>{if(scaleDragging)return;clearTimeout(hideTimer);hideCard();}).catch(()=>{});
// The size can also be changed from the settings window, which is a different window entirely.
// Ignore it while this page's own slider is being dragged, or the two would fight each other.
listen('scale',e=>{
  if(scaleDragging) return;
  const n=Number(e.payload); if(!isFinite(n)||n<=0) return;
  scalePct=clampPct(Math.round(n*100));
  applyPillScale();
  const r=document.getElementById('scale-range');
  if(r){r.value=String(scalePct);const lab=document.getElementById('scale-val');if(lab)lab.textContent=scalePct+'%';}
}).catch(()=>{});
// Card content changes change its height -> report the hot rectangles again
listen('usage',()=>{if(card.classList.contains('show'))armWatchdog();}).catch(()=>{});
listen('state',()=>{if(card.classList.contains('show'))armWatchdog();}).catch(()=>{});
/* The pill can be dragged up and down the right edge. Press and move more than 4 px = drag (handed to Rust,
   which follows the system cursor; the card is collapsed first); release without moving = click (opens the provider's usage page). */
let press=null, dragging=false;
pill.addEventListener('mousedown',e=>{ if(e.button!==0)return; if(e.target.closest('.tab')){ setFolded(true); return; } press={x:e.clientX,y:e.clientY,id:cellAt(e.clientX,e.clientY)||hoverId}; });
document.addEventListener('mousemove',e=>{
  if(!press||dragging)return;
  if(Math.abs(e.clientY-press.y)>4||Math.abs(e.clientX-press.x)>4){
    dragging=true; clearTimeout(hideTimer); hideCard();
    invoke('drag_begin').catch(err=>{notice('drag_begin failed: '+err);dragging=false;});
  }
});
document.addEventListener('mouseup',e=>{
  if(e.button!==0)return;
  if(press&&!dragging){
    if(press.id==='novarc') invoke('open_consumo',{provider:'all'}).catch(e=>notice('open_consumo failed: '+e));
    else if(press.id==='mon') invoke('open_consumo',{provider:'companion'}).catch(e=>notice('open_consumo failed: '+e));
    else invoke('open_provider_page',{provider:press.id}).catch(()=>{});
  }
  press=null;
});
listen('drag_end',()=>{dragging=false;press=null;reportHot();}).catch(()=>{});
// Right-click on the pill opens the settings window, the same as the tray menu
pill.addEventListener('contextmenu',e=>{ e.preventDefault(); invoke('open_settings').catch(err=>notice('open_settings failed: '+err)); });

// Folding away: remembered in this WebView's storage, so a restart keeps the pill where it was left
function isFolded(){ return root.classList.contains('folded'); }
function setFolded(on){
  root.classList.toggle('folded',on);
  try{ localStorage.setItem('folded',on?'1':''); }catch(e){}
  clearTimeout(hideTimer); hideCard(); // also reports the new hot area
}
foldTab.addEventListener('mousedown',e=>{ if(e.button===0) setFolded(false); });
pill.addEventListener('transitionend',reportHot); // the pill's rectangle is only final once it has slid
try{ if(localStorage.getItem('folded')==='1') root.classList.add('folded'); }catch(e){}

function notice(msg){
  const n=document.getElementById('notice');
  n.textContent=msg;n.classList.add('show');
  clearTimeout(n._h);n._h=setTimeout(()=>n.classList.remove('show'),6000);
}

listen('usage',e=>{usage=e.payload||usage;renderRing();if(card.classList.contains('show'))renderCard();})
  .catch(e=>notice('listen(usage) failed: '+e));
listen('state',e=>{stateSnap=e.payload||stateSnap;setUiLanguage(stateSnap.lang_resolved);renderRing();if(card.classList.contains('show'))renderCard();})
  .catch(e=>notice('listen(state) failed: '+e));
listen('notice',e=>notice(e.payload)).catch(()=>{});
listen('codex',e=>{codexSnap=e.payload||codexSnap;renderRing();if(card.classList.contains('show'))renderCard();}).catch(()=>{});
listen('cursor',e=>{cursorSnap=e.payload||cursorSnap;renderRing();if(card.classList.contains('show'))renderCard();}).catch(()=>{});
invoke('get_cursor').then(u=>{cursorSnap=u||cursorSnap;renderRing();}).catch(()=>{});
listen('antigravity',e=>{agSnap=e.payload||agSnap;renderRing();if(card.classList.contains('show'))renderCard();}).catch(()=>{});
invoke('get_antigravity').then(u=>{agSnap=u||agSnap;renderRing();}).catch(()=>{});
loadScale();
invoke('get_notch_slots').then(v=>{if(Array.isArray(v)){notchSlots=v;renderRing();}}).catch(()=>{});
listen('notch_slots',e=>{
  notchSlots=Array.isArray(e.payload)?e.payload:null;
  renderRing();
  if(card.classList.contains('show')){renderCard();armWatchdog();}
}).catch(()=>{});
invoke('get_antigravity_prefs').then(p=>{if(p){agPrefs=p;renderRing();}}).catch(()=>{});
listen('antigravity_prefs',e=>{if(e.payload){agPrefs=e.payload;renderRing();}}).catch(()=>{});
listen('glyphs',e=>{glyphs=e.payload||glyphs;renderRing();if(card.classList.contains('show'))renderCard();}).catch(()=>{});
listen('activity',e=>{activity=e.payload||activity;renderRing();if(card.classList.contains('show'))renderCard();}).catch(()=>{});
invoke('get_activity').then(a=>{activity=a||activity;renderRing();}).catch(()=>{});
invoke('get_glyphs').then(g=>{glyphs=g||glyphs;renderRing();}).catch(()=>{});
invoke('get_codex').then(u=>{codexSnap=u||codexSnap;renderRing();}).catch(()=>{});
invoke('get_usage').then(u=>{usage=u||usage;renderRing();}).catch(e=>notice('get_usage failed: '+e));
listen('claude_accounts',e=>{
  claudeAccounts=Array.isArray(e.payload)?e.payload:claudeAccounts;
  renderRing();
  if(card.classList.contains('show')){renderCard();armWatchdog();}
}).catch(()=>{});
invoke('get_ring_reads').then(v=>{ringReads=v||'session';renderRing();}).catch(()=>{});
listen('codeburn',e=>{ if(e.payload){ cb=e.payload; renderRing(); if(card.classList.contains('show')){renderCard();armWatchdog();} } }).catch(()=>{});
invoke('get_codeburn').then(v=>{ if(v){ cb=v; renderRing(); } }).catch(()=>{});
// Inside the card: a period tab re-reads the Consumo block; "See all" opens the panel on that tool
card.addEventListener('click',e=>{
  const per=e.target.closest('[data-period]');
  if(per){ cardPeriod=per.dataset.period; renderCard(); armWatchdog(); return; }
  if(e.target.closest('[data-settings]')){ invoke('open_settings').catch(err=>notice('open_settings failed: '+err)); return; }
  const op=e.target.closest('[data-open]');
  if(op) invoke('open_consumo',{provider:op.dataset.open}).catch(err=>notice('open_consumo failed: '+err));
});
invoke('get_claude_accounts').then(a=>{if(Array.isArray(a)){claudeAccounts=a;renderRing();}}).catch(()=>{});
invoke('get_state').then(s=>{stateSnap=s||stateSnap;setUiLanguage(stateSnap.lang_resolved);renderRing();}).catch(()=>{});
setInterval(renderRing,30_000); // stale state and reset copy move with time
listen('companion',e=>{ if(e.payload){ comp=e.payload; renderRing(); if(card.classList.contains('show')&&hoverId==='mon'){renderCard();armWatchdog();} } }).catch(()=>{});
listen('companion_event',e=>{ if(e.payload) monEvent(e.payload); }).catch(()=>{});
listen('companion_prefs',e=>{ if(e.payload){ cprefs=e.payload; renderRing(); } }).catch(()=>{});
listen('tokens',e=>{ if(e.payload){ tokSnap=e.payload; renderRing(); if(card.classList.contains('show')&&hoverId==='mon') renderCard(); } }).catch(()=>{});
invoke('get_companion_prefs').then(p=>{ if(p){ cprefs=p; renderRing(); } }).catch(()=>{});
invoke('get_companion').then(v=>{ if(v){ comp=v; renderRing(); } }).catch(()=>{});
invoke('get_tokens').then(v=>{ if(v){ tokSnap=v; renderRing(); } }).catch(()=>{});
</script>
</body>
</html>
