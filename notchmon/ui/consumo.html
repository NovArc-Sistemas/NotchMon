<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>NotchMon</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;background:transparent;overflow:hidden;user-select:none}
  body{font-family:"Segoe UI",system-ui,sans-serif;color:#e8e8ea;font-size:12px}
  /* The window is exactly as tall as this panel (the page reports its height), so nothing ever scrolls */
  .panel{width:100%;background:#0b0b0b;border:1px solid #2a2a2a;border-radius:16px;padding:14px 16px 10px;position:relative}
  .hd{display:flex;align-items:center;gap:8px}.hd b{font-size:15px;color:#fff;margin-right:auto}
  .hd svg{width:20px;height:19px;display:block}
  .muted{color:#8a8a8a;font-size:10.5px}
  .x{color:#8a8a8a;font-size:18px;line-height:1;cursor:pointer;padding:0 2px}.x:hover{color:#fff}
  .x.gear{display:inline-flex;padding:3px;border-radius:6px;margin-right:2px}.x.gear:hover{background:#1e1e1e}.x.gear svg{width:16px;height:16px}
  /* The five tabs: Uso is the codeburn panel as it was; the other four are the companion */
  .tabs{display:flex;gap:3px;background:#151515;border-radius:10px;padding:3px;margin-top:10px}
  .tabs span{flex:1;min-width:0;text-align:center;padding:6px 1px;border-radius:8px;color:#9a9a9a;font-size:11px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tabs span.on{background:#2a2a2a;color:#fff;font-weight:700}
  section[hidden]{display:none}
  .seg{display:flex;gap:3px;background:#151515;border-radius:8px;padding:2px;margin-top:8px}
  .seg span{flex:1;text-align:center;padding:4px 0;border-radius:6px;color:#9a9a9a;font-size:11px;cursor:pointer}
  .seg span.on{background:#2a2a2a;color:#fff;font-weight:600}
  .seg span.blue.on{background:#0a84ff}
  .kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}
  .kpi{background:#151515;border-radius:8px;padding:6px 8px}.kpi b{display:block;font-size:15px;color:#fff;font-variant-numeric:tabular-nums}.kpi span{color:#8a8a8a;font-size:10px}
  .split{display:flex;height:6px;border-radius:3px;overflow:hidden;margin:10px 0 4px;background:#1c1c1c}
  .legend2{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:10.5px;color:#bdbdbd}.legend2 i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:4px}
  .blk{margin-top:14px}
  .blk-h{display:flex;justify-content:space-between;align-items:baseline;font-weight:700;color:#fff}
  .blk-h em{font-style:normal;font-weight:400;color:#8a8a8a;font-size:10.5px}
  .metric{display:flex;gap:6px;margin:6px 0 8px}.metric span{padding:2px 8px;border-radius:10px;background:#151515;color:#9a9a9a;font-size:10.5px;cursor:pointer}.metric span.on{background:#3a220e;color:#ffb070}
  .months{display:grid;grid-template-columns:repeat(26,1fr);gap:3px;font-size:9px;color:#6a6a6a;margin-bottom:3px;height:11px}
  .months span{white-space:nowrap}
  .heat{display:grid;grid-template-columns:repeat(26,1fr);grid-template-rows:repeat(7,auto);gap:3px}
  .heat i{aspect-ratio:1;border-radius:2px;background:#1c1c1c;display:block}
  .heat i.fut{background:transparent}
  .heat i.today{outline:1.5px solid #fff;outline-offset:-1px}
  .heat i:not(.fut):hover{outline:1.5px solid #ffb070;outline-offset:-1px}
  .hl{display:flex;justify-content:space-between;align-items:center;margin-top:6px;font-size:10px;color:#6a6a6a}
  .scale{display:flex;gap:3px;align-items:center}.scale i{width:10px;height:10px;border-radius:2px;display:block}
  details{border-top:1px solid #1c1c1c}
  details:first-of-type{margin-top:12px}
  summary{list-style:none;display:flex;align-items:center;gap:8px;padding:8px 0;cursor:pointer;color:#e8e8ea;font-weight:600}
  summary::-webkit-details-marker{display:none}
  summary .val{margin-left:auto;color:#9a9a9a;font-weight:400;font-size:11px;max-width:60%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  summary .chev{color:#6a6a6a;transition:transform .15s;width:10px}
  details[open] summary .chev{transform:rotate(90deg)}
  .body{padding:0 0 10px 18px}
  .li{display:flex;justify-content:space-between;gap:10px;margin:3px 0;color:#cfcfcf}
  .li span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .li span:last-child{color:#9a9a9a;white-space:nowrap;font-variant-numeric:tabular-nums}
  .warn{color:#FFB347 !important}
  .chart{display:flex;align-items:flex-end;gap:3px;height:44px;border-bottom:1px solid #262626}.chart i{flex:1;border-radius:2px 2px 0 0;min-height:1px;display:block}
  .axis{display:flex;justify-content:space-between;color:#6a6a6a;font-size:9.5px;margin-top:2px}
  .empty{color:#8a8a8a;padding:12px 0}
  /* The day's popup, over the panel above the grid: outside it would need a window strip that swallows clicks */
  #tip{position:absolute;z-index:9;pointer-events:none;width:260px;background:#0b0b0b;border:1px solid #3a3a3a;border-radius:12px;padding:10px 12px;box-shadow:0 8px 24px rgba(0,0,0,.6);display:none}
  #tip .t-h{font-weight:700;color:#fff;font-size:13px}
  #tip .t-sub{color:#8a8a8a;font-size:10.5px;margin-bottom:8px}
  #tip .g{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  #tip .g div{background:#151515;border-radius:8px;padding:5px 7px}#tip .g b{display:block;color:#fff;font-size:13px}#tip .g span{color:#8a8a8a;font-size:9.5px}
  #tip h5{margin:8px 0 3px;font-size:10.5px;color:#cfcfcf}
  #tip .li{font-size:11px;margin:2px 0}
  /* ---- companion surfaces (PokeTokenBar's tabs on codenotch's tokens) ---- */
  .spr{image-rendering:pixelated;display:block}
  .box{background:#151515;border-radius:12px;padding:12px 14px}
  .hero{display:flex;gap:14px;align-items:flex-start;margin-top:14px}
  .hero .pic{width:96px;height:96px;background:#151515;border-radius:14px;display:flex;align-items:center;justify-content:center;flex:0 0 auto;position:relative}
  .hero .pic .spr{width:84px;height:84px;object-fit:contain}
  .hero .pic.shiny{box-shadow:inset 0 0 0 1px #6b5a10}
  .h-name{font-size:17px;font-weight:700;color:#fff;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .badge{display:inline-block;font-size:9px;font-weight:800;letter-spacing:.3px;padding:2px 7px;border-radius:9px;color:#fff;vertical-align:middle}
  .h-sub{font-size:12px;color:#9a9a9a;font-weight:600;margin-top:3px}
  .xp{height:8px;border-radius:4px;background:#2d2d2d;overflow:hidden;margin-top:8px}.xp div{height:100%;border-radius:4px;background:#e8e8ea;transition:width .3s}
  .h-left{font-size:11.5px;color:#808080;margin-top:4px}
  .h-mood{font-size:12.5px;color:#e8e8ea;font-weight:600;margin-top:4px}
  .evo{display:flex;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap}
  .evo .n{display:flex;flex-direction:column;align-items:center;gap:1px;font-size:10.5px;color:#c8c8c8;min-width:44px}
  .evo .n .spr{width:40px;height:40px;object-fit:contain}
  .evo .n.future .spr{filter:brightness(0) invert(.3)}
  .evo .n.mystery .spr{filter:brightness(0) invert(.18)}
  .evo .n i{width:5px;height:5px;border-radius:3px;background:transparent;display:block;margin-top:2px}
  .evo .n.current i{background:#0a84ff}
  .evo svg{width:14px;height:14px}
  .hair{border-top:1px solid #1e1e1e;margin:12px 0}
  .big{font-size:30px;font-weight:700;letter-spacing:-.5px;font-variant-numeric:tabular-nums;line-height:1;color:#fff}
  .row{display:flex;align-items:center;gap:10px}
  .sech{font-size:11px;font-weight:700;color:#8a8a8a;letter-spacing:.4px;text-transform:uppercase;margin:12px 0 6px}
  .ptabs{display:flex;gap:2px;margin-top:10px}.ptabs span{flex:1;text-align:center;padding:5px 0;color:#9a9a9a;font-size:12px;cursor:pointer;border-radius:6px}.ptabs span.on{color:#0a84ff;font-weight:700}
  .w-row{display:flex;justify-content:space-between;align-items:baseline;font-size:12.5px;gap:8px;margin-top:8px}
  .w-label{font-weight:600;color:#e8e8ea}.w-reset{color:#808080;font-size:11px;margin-left:auto}
  .w-track{height:5px;border-radius:3px;background:#2d2d2d;margin:5px 0 2px;overflow:hidden}.w-fill{height:100%;border-radius:3px}
  .item{background:#151515;border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;margin-top:10px}
  .item .top{display:flex;gap:12px;align-items:flex-start}
  .item .ico{width:40px;height:40px;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
  .item .ico .spr{width:32px;height:32px;object-fit:contain}
  .item .ico .spr.egg{width:44px;height:44px}
  .item b{font-size:14px;color:#fff}
  .item .desc{font-size:12px;color:#9a9a9a;line-height:1.4;margin-top:2px}
  .item .foot{display:flex;justify-content:space-between;align-items:center;gap:8px}
  .item .price{font-size:12px;color:#808080}
  .btn{background:#2a2a2a;border:1px solid #3a3a3a;border-radius:9px;padding:5px 14px;font-size:12.5px;font-weight:600;color:#fff;cursor:pointer;font-family:inherit}
  .btn:hover{border-color:#5a5a5a}
  .btn.blue{background:#0a84ff;border-color:#0a84ff}
  .btn.ghost{background:transparent}
  .btn[disabled]{opacity:.4;cursor:default}
  .own{font-size:11px;color:#9a9a9a;font-weight:600}
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
  .chip{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:12px;background:#151515;font-size:11px;color:#9a9a9a;font-weight:600;cursor:pointer}
  .chip i{width:6px;height:6px;border-radius:3px;display:block}
  .chip.off{opacity:.45}
  .dexgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
  .dex{background:#151515;border-radius:10px;padding:8px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;border:1.5px solid transparent;cursor:pointer;position:relative}
  .dex small{color:#8a8a8a;font-size:10px}
  .dex .spr{width:48px;height:48px;object-fit:contain}
  .dex:hover{border-color:#3a3a3a}
  .dex.rep{border-color:#0a84ff}
  .dex .star{position:absolute;right:5px;top:4px;font-size:10px;color:#ffd60a}
  .pager{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:#9a9a9a;margin-top:10px}
  .pager span{cursor:pointer;padding:0 6px}
  .log{background:#151515;border-radius:12px;padding:12px 14px;margin-top:10px}
  .log .top{display:flex;gap:8px;align-items:center}
  .log .chain{display:flex;align-items:center;gap:12px;margin-top:10px;flex-wrap:wrap}
  .log .chain .n{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:#c8c8c8}
  .log .chain .n .spr{width:52px;height:52px;object-fit:contain}
  .log .when{font-size:11.5px;color:#808080;margin-top:6px}
  .log .chain svg{width:16px;height:16px;flex:0 0 auto}
  .stat{display:grid;grid-template-columns:64px 1fr 34px 42px;align-items:center;gap:10px;font-size:12px;margin:6px 0}
  .stat .t{height:5px;border-radius:3px;background:#2d2d2d;overflow:hidden}.stat .t div{height:100%;background:#0a84ff;border-radius:3px}
  .back{color:#0a84ff;font-size:12.5px;cursor:pointer}
  .kv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;font-size:13px}.kv span{display:block;font-size:11px;color:#9a9a9a}.kv b{color:#fff}
  #toast{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);background:#1c1c1c;border:1px solid #3a3a3a;border-radius:9px;padding:6px 12px;font-size:11.5px;color:#e8e8ea;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap}
  #toast.show{opacity:1}
  .confirm{background:#1c1c1c;border-radius:9px;padding:8px 10px;font-size:11.5px;color:#e8e8ea;line-height:1.4}
  .confirm .row{margin-top:8px;justify-content:flex-end}
</style></head><body>

/* ---- sprites: data URLs from Rust, cached here; an <img data-need> is filled when it arrives ---- */
const SPR={}, pending=new Set();
function sprKey(id,anim,shiny){ return `${id}|${anim?1:0}|${shiny?1:0}`; }
function spr(id,anim,shiny,cls){
  const k=sprKey(id,anim,shiny);
  if(SPR[k]) return `<img class="spr ${cls||''}" src="${SPR[k]}" alt="">`;
  // The static frame is the placeholder while the GIF downloads
  const s=SPR[sprKey(id,false,shiny)];
  return `<img class="spr ${cls||''}" data-need="${k}"${s?` src="${s}"`:''} alt="">`;
}
function fillSprites(){
  document.querySelectorAll('img[data-need]').forEach(img=>{
    const k=img.dataset.need; if(SPR[k]){ img.src=SPR[k]; img.removeAttribute('data-need'); return; }
    if(pending.has(k)) return; pending.add(k);
    const [id,a,sh]=k.split('|');
    invoke('get_sprite',{what:id,animated:a==='1',shiny:sh==='1'}).then(u=>{ pending.delete(k); if(u){ SPR[k]=u; document.querySelectorAll(`img[data-need="${k}"]`).forEach(i=>{i.src=u;i.removeAttribute('data-need');}); report(); } }).catch(()=>pending.delete(k));
  });
}
const animated=()=>prefs.animation!=='saver';
const badge=(txt,col)=>`<span class="badge" style="background:${col}">${esc(txt)}</span>`;
const arrow='<svg viewBox="0 0 24 24" fill="none" stroke="#555" stroke-width="2" stroke-linecap="round"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>';

/* ---- tabs ---- */
function setTab(t){
  tab=t; document.querySelectorAll('#tabs span').forEach(s=>s.classList.toggle('on',s.dataset.t===t));
  for(const id of ['uso','companion','shop','bag','dex']) document.getElementById('t-'+id).hidden=id!==t;
  document.getElementById('title').textContent=t==='uso'?T('Uso'):'NotchMon';
  render();
}
document.getElementById('tabs').addEventListener('click',e=>{const s=e.target.closest('span'); if(s) setTab(s.dataset.t);});

function render(){
  applyStatic();
  if(tab==='uso') renderUso(); else if(tab==='companion') renderCompanion(); else if(tab==='shop') renderShop(); else if(tab==='bag') renderBag(); else renderDex();
  fillSprites(); report();
}

// ---- activity grid: 26 weeks, one square a day, from codeburn's session list ----
const metricOf={s:d=>d.s, tok:d=>d.in+d.out+d.cr+d.cw, c:d=>d.c, k:d=>d.k};
const fmtOf={s:v=>nf(v)+' '+T('sessions'), tok:v=>tok(v)+' '+T('tokens'), c:v=>usd(v), k:v=>nf(v)+' '+T('calls')};
function ymd(d){ return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function buildHeat(){
  const today=new Date(); today.setHours(12,0,0,0);
  const start=new Date(today); start.setDate(today.getDate()-today.getDay()-7*25);
  const cells=[], months=[];
  for(let w=0;w<26;w++){
    const first=new Date(start); first.setDate(start.getDate()+7*w);
    if(first.getDate()<=7) months.push(`<span style="grid-column:${w+1}">${first.toLocaleString(lang==='pt'?'pt-BR':'en-US',{month:'short'})}</span>`);
    for(let r=0;r<7;r++){
      const d=new Date(start); d.setDate(start.getDate()+7*w+r);
      const k=ymd(d), cls=d>today?'fut':(k===ymd(today)?'today':'');
      cells.push(`<i data-d="${k}" class="${cls}" style="grid-column:${w+1};grid-row:${r+1}"></i>`);
    }
  }
  document.getElementById('months').innerHTML=months.join('');
  document.getElementById('heat').innerHTML=cells.join('');
  document.querySelectorAll('#heat i:not(.fut)').forEach(c=>{
    c.addEventListener('mouseenter',()=>showTip(c)); c.addEventListener('mouseleave',()=>{tip.style.display='none';});
  });
}
function paintHeat(){
  const days=(cb.days||{})[prov]||{}, cells=[...document.querySelectorAll('#heat i')];
  const vals=cells.map(c=>days[c.dataset.d]?metricOf[metric](days[c.dataset.d]):0), mx=Math.max(...vals,1);
  cells.forEach((c,i)=>{ if(c.classList.contains('fut'))return; const f=vals[i]/mx; c.style.background=RAMP[vals[i]===0?0:f<.15?1:f<.35?2:f<.65?3:4]; });
  const act=cells.filter(c=>days[c.dataset.d]), total=act.reduce((a,c)=>a+metricOf[metric](days[c.dataset.d]),0);
  document.getElementById('heat-sum').textContent=act.length?`${act.length} ${T('active days')} · ${fmtOf[metric](total)} ${T('in 26 weeks')}`:T('no history yet');
  const best=act.reduce((a,c)=>!a||metricOf[metric](days[c.dataset.d])>metricOf[metric](days[a.dataset.d])?c:a,null);
  document.getElementById('peak').textContent=best?`${T('Peak')}: ${best.dataset.d.slice(8)}/${best.dataset.d.slice(5,7)} · ${fmtOf[metric](metricOf[metric](days[best.dataset.d]))}`:'';
}
const tip=document.getElementById('tip');
const DOW=()=>lang==='pt'?['Dom','Seg','Ter','Qua','Qui','Sex','Sáb']:['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
function showTip(c){
  const key=c.dataset.d, d=((cb.days||{})[prov]||{})[key], dt=new Date(key+'T12:00');
  let h=`<div class="t-h">${DOW()[dt.getDay()]}, ${key.slice(8)}/${key.slice(5,7)}/${key.slice(0,4)}${c.classList.contains('today')?' · '+T('today'):''}</div>`;
  if(!d) h+=`<div class="t-sub">${T('No recorded activity')}</div>`;
  else{

    h+=`<div class="t-sub">${nf(d.s)} ${T('sessions')}${prov==='all'&&by?' · '+esc(by):''}</div><div class="g">
      <div><span>${T('API cost')}</span><b>${usd(d.c)}</b></div><div><span>${T('Calls')}</span><b>${nf(d.k)}</b></div>
      <div><span>${T('Turns')}</span><b>${nf(d.t)}</b></div><div><span>${T('Tokens')}</span><b>${tok(d.in+d.out+d.cr+d.cw)}</b></div>
      <div><span>${T('Input / output')}</span><b>${tok(d.in)} / ${tok(d.out)}</b></div><div><span>${T('Cache read / write')}</span><b>${tok(d.cr)} / ${tok(d.cw)}</b></div></div>`;
    if(d.p&&d.p.length) h+=`<h5>${T('Projects')}</h5>`+d.p.map(([n,v])=>li(esc(n),usd(v))).join('');
    if(d.m&&d.m.length) h+=`<h5>${T('Models')}</h5><div class="li"><span>${esc(d.m.join(' · '))}</span><span></span></div>`;
  }
  tip.innerHTML=h; tip.style.display='block';
  const panel=document.getElementById('panel').getBoundingClientRect(), heat=document.getElementById('heat').getBoundingClientRect(), r=c.getBoundingClientRect();
  const W=tip.offsetWidth, H=tip.offsetHeight;
  let x=r.left+r.width/2-W/2-panel.left; x=Math.max(8,Math.min(x,panel.width-W-8));
  let y=heat.top-panel.top-H-8; if(y<8) y=heat.bottom-panel.top+8;
  tip.style.left=x+'px'; tip.style.top=y+'px';
}

/* ================= Companion ================= */
function moodText(){
  const ev=comp.lastEvent, live=comp.eventUntil>Date.now();
  if(comp.isEgg) return comp.eggUsage>0?T('Hatching soon.'):T('Incubating');
  if(live&&ev){
    if(ev.kind==='evolved') return `${esc(ev.name)} ${T('evolved!')}`;
    if(ev.kind==='hatched') return T('It grew!');
    if(ev.kind==='dittoRevealed') return T('Huh? It is Ditto!');
  }
  return T({idle:'Keeping quiet today.',working:"Today's work is piling up.",focus:'In focus mode now.',tired:'Close to the limit. A short break is fine.',sleep:'Sleeping now.',levelUp:'It grew!'}[comp.display]||'Keeping quiet today.');
}
function heroHtml(){
  if(!comp) return `<div class="empty">${T('Waiting for the first reading…')}</div>`;
  if(comp.isEgg){
    const p=Math.min(1,comp.eggUsage/Math.max(1,comp.eggThreshold));
    return `<div class="hero"><div class="pic">${spr(0,false,false)}</div><div style="flex:1;min-width:0">
      <div class="h-name">${T('Egg')} ${comp.eggTier?badge(rarName(comp.eggTier).toUpperCase()+' +',RAR[comp.eggTier]):''}</div>
      <div class="h-sub">${p>=.9?T('About to hatch!'):T('Incubating')}</div>
      <div class="xp"><div style="width:${(p*100).toFixed(1)}%"></div></div>
      <div class="h-left">${tok(Math.max(0,comp.eggThreshold-comp.eggUsage))} ${T('to hatch')}</div>
      <div class="h-mood">${moodText()}</div></div></div>`;
  }
  const a=comp.active, sh=a.isShiny&&!(a.dittoDisguise&&!a.dittoRevealed);
  const stage=comp.isFinal?T('Final form'):`${T('Form')} ${a.stage+1} ${T('of')} ${a.totalForms}`;
  const left=`${tok(comp.tokensToNext)} ${comp.isFinal?T('to graduation'):T('to next evolution')}`;
  let line='';
  for(let i=0;i<comp.line.length;i++){
    const [id,st]=comp.line[i];
    line+=`<div class="n ${st}">${spr(st==='mystery'?id:id,false,sh)}<span>${st==='mystery'?'?':esc(comp.names&&comp.names[id]||nameOf(id))}</span><i></i></div>`;
    if(i<comp.line.length-1) line+=arrow;
  }
  return `<div class="hero"><div class="pic${sh?' shiny':''}">${spr(comp.currentId,animated(),sh)}</div><div style="flex:1;min-width:0">
      <div class="h-name">${esc(comp.name)} ${badge(rarName(a.rarity).toUpperCase(),RAR[a.rarity])}${sh?badge('✨ SHINY','#6b5a10'):''}${a.growthBoost?badge('×2','#2a2a2a'):''}</div>
      <div class="h-sub">${stage} · ${esc(natName(a.nature))} · ${T('Lv.')} ${a.profile.level}</div>
      <div class="xp"><div style="width:${(comp.progress*100).toFixed(1)}%"></div></div>
      <div class="h-left">${left}</div>
      <div class="h-mood">${moodText()}</div></div></div>
    <div class="evo">${line}</div>`;
}
function nameOf(id){
  if(!comp) return '#'+id;
  const pick=m=>m&&(lang==='pt'?(m['pt-br']||m['pt']||m['en']):(m[lang]||m['en']));
  if(comp.active&&comp.active.names&&comp.active.names[id]) return pick(comp.active.names[id])||'#'+id;
  for(const d of comp.dex||[]) if(d.names&&d.names[id]) return pick(d.names[id])||'#'+id;
  return '#'+id;
}
function resetCopy(ms){
  if(!ms) return '';
  const diff=ms-Date.now(); if(diff<=0) return T('Resetting…');
  const d=new Date(ms), loc=lang==='pt'?'pt-BR':'en-US';
  const t=d.toLocaleTimeString(loc,{hour:'numeric',minute:'2-digit',hourCycle:clock24?'h23':'h12'});
  const m=Math.round(diff/60000);
  const rel=m<60?`${m}m`:m<24*60?`${Math.floor(m/60)}h ${m%60}m`:`${Math.floor(m/1440)}d ${Math.floor((m%1440)/60)}h`;
  return diff<24*3600e3?`${rel} (${t})`:`${rel} (${d.toLocaleDateString(loc,{weekday:'short'})} ${t})`;
}

function speciesList(){
  // One cell per species owned: every graduated or released chain, plus the active one's reached forms
  const acc={};
  const add=(id,rarity,shiny,raising,names)=>{ const a=acc[id]||(acc[id]={id,rarity,shiny:false,raising:false,names:null}); if(shiny) a.shiny=true; if(raising) a.raising=true; if(names&&names[id]) a.names=names[id]; if(RANK[rarity]>RANK[a.rarity]) a.rarity=rarity; };
  for(const d of comp.dex||[]) for(const id of d.chain) add(id,d.rarity,d.shiny||d.isShiny,false,d.names);
  if(comp.active){ const a=comp.active, dis=a.dittoDisguise&&!a.dittoRevealed; for(const id of a.path.slice(0,a.stage+1)) add(id,a.rarity,a.isShiny&&!dis,true,a.names); }
  return Object.values(acc).sort((x,y)=>x.id-y.id);
}

}

    const lvl=prof?prof.level:5, gender=prof&&prof.gender?T(g[prof.gender]||prof.gender):'—';
    const ab=profile.details.abilities.find(x=>x.name===(prof&&prof.ability))||profile.details.abilities[0];
    h+=`<div class="kv"><div><span>${T('Level')}</span><b>${lvl}</b></div><div><span>${T('Gender')}</span><b>${gender}</b></div><div><span>${T('Nature')}</span><b>${esc(natName(nature))}</b></div><div style="grid-column:span 3"><span>${T('Ability')}</span><b>${esc(moveName(ab?ab.name:'—'))}${ab&&ab.is_hidden?` <span style="color:#9a9a9a;font-weight:400">(${T('hidden')})</span>`:''}</b></div></div>`;
    const SN={hp:'HP',attack:'Attack',defense:'Defense','special-attack':'Sp. Atk','special-defense':'Sp. Def',speed:'Speed'};
    const mx=Math.max(300,...profile.stats.map(s=>s.value)); const top=Math.ceil(mx/100)*100;
    h+=`<div class="sech">${T('Actual stats')}</div>`+profile.stats.map(s=>`<div class="stat"><span>${T(SN[s.name]||s.name)}</span><div class="t"><div style="width:${(s.value/top*100).toFixed(1)}%"></div></div><b style="text-align:right;color:#fff">${s.value}</b><span style="color:#9a9a9a;text-align:right">IV ${s.iv}</span></div>`).join('');
    h+=`<div class="sech">${T('Known moves')}</div>`+(profile.moves.length?profile.moves.map(([m,l])=>`<div class="row" style="justify-content:space-between;font-size:12.5px;padding:3px 0"><span>${esc(moveName(m))}</span><span style="color:#9a9a9a">${T('Lv.')} ${l}</span></div>`).join(''):`<div class="muted">—</div>`);
    h+=`</div>`;
  }
  el.innerHTML=h;
  document.getElementById('back').addEventListener('click',()=>{profileId=null;profile=null;render();});
  document.getElementById('pin').addEventListener('click',()=>act('representative',String(id),T('Pinned')));
  const up=document.getElementById('unpin'); if(up) up.addEventListener('click',()=>act('representative','none',''));
}

/* ---- wiring ---- */
let lastH=0;
function report(){ requestAnimationFrame(()=>{ const h=Math.ceil(document.getElementById('panel').getBoundingClientRect().height)+2; if(Math.abs(h-lastH)>1){ lastH=h; invoke('consumo_height',{h}).catch(()=>{}); } }); }
document.getElementById('prov').addEventListener('click',e=>{const s=e.target.closest('span'); if(s){prov=s.dataset.v; render();}});
document.getElementById('per').addEventListener('click',e=>{const s=e.target.closest('span'); if(s){per=s.dataset.v; render();}});
document.getElementById('metric').addEventListener('click',e=>{const s=e.target.closest('span'); if(!s)return; metric=s.dataset.m; document.querySelectorAll('#metric span').forEach(x=>x.classList.toggle('on',x===s)); paintHeat();});
const close=()=>invoke('close_consumo').catch(()=>{});
document.getElementById('close').addEventListener('click',close);
document.getElementById('settings').addEventListener('click',()=>invoke('open_settings').catch(()=>{}));
document.addEventListener('keydown',e=>{ if(e.key==='Escape'){ if(profileId){profileId=null;render();} else close(); } });
listen('codeburn',e=>{ if(e.payload){ cb=e.payload; render(); } }).catch(()=>{});
listen('consumo_open',e=>{ const p=e.payload; if(!p) return; if(['companion','shop','bag','dex'].includes(p)){ setTab(p); } else { prov=p; setTab('uso'); } }).catch(()=>{});
listen('companion',e=>{ if(e.payload){ comp=e.payload; if(tab!=='uso') render(); } }).catch(()=>{});
listen('tokens',e=>{ if(e.payload){ tokens=e.payload; if(tab==='companion') render(); } }).catch(()=>{});
listen('companion_prefs',e=>{ if(e.payload){ prefs=e.payload; render(); } }).catch(()=>{});
listen('usage',e=>{ usage=e.payload||usage; if(tab==='companion') render(); }).catch(()=>{});
listen('codex',e=>{ codexU=e.payload||codexU; if(tab==='companion') render(); }).catch(()=>{});
listen('state',e=>{ const s=e.payload; if(!s) return; const l=s.lang_resolved==='pt'?'pt':'en'; clock24=!!s.clock_24h; if(l!==lang){ lang=l; buildHeat(); render(); } }).catch(()=>{});
invoke('get_state').then(s=>{ if(s){ lang=s.lang_resolved==='pt'?'pt':'en'; clock24=!!s.clock_24h; } buildHeat(); render(); }).catch(()=>{ buildHeat(); render(); });
invoke('get_codeburn').then(v=>{ if(v){ cb=v; } render(); }).catch(()=>render());
invoke('get_companion').then(v=>{ if(v){ comp=v; render(); } }).catch(()=>{});
invoke('get_tokens').then(v=>{ if(v){ tokens=v; render(); } }).catch(()=>{});
invoke('get_companion_prefs').then(v=>{ if(v){ prefs=v; render(); } }).catch(()=>{});
invoke('get_usage').then(u=>{ usage=u||usage; }).catch(()=>{});
invoke('get_codex').then(u=>{ codexU=u||codexU; }).catch(()=>{});
setInterval(()=>{ if(tab==='companion') render(); },30000);
</script>
</body></html>
